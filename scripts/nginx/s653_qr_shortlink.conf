# [S653-20260924] 「小程序切换自由」探针：短链跳板
#
# 目的：验证【微信扫一扫在做"普通链接二维码→小程序"规则匹配时，是否跟随后端 302 跳转】。
#   跟 → 可以把贴纸/屏幕上的二维码都做成"跳板"，切换小程序时只改我们服务器一处，
#        微信后台一条规则都不用删、贴纸也不用重印。
#   不跟 → 只能维持现状（谁认领 /store 谁生效，切换必须删旧配置）。
#
# 本次只在 175 的 /etc/nginx/sites-enabled/locker-cqdyxl 里【新增】两个精确 location，
# 放在 `location / {` 之前；不改任何已有 location、不改应用代码、不需要 HUP。
#   /g/x -> 贴纸上的那个地址(locker.cqdyxl.com/store)
#   /g/y -> H5 实际所在域名(kelaiwei.top/store)
# 测试完可整段删除（回滚=删这两行 + nginx -t + reload）。
    location = /g/x { return 302 https://locker.cqdyxl.com/store?cabinet_id=1; }
    location = /g/y { return 302 https://kelaiwei.top/store?cabinet_id=1; }
