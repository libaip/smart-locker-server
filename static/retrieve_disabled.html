<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>二维码已停用</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Helvetica,Arial,sans-serif;
     background:#f5f6f8;color:#1f2329;display:flex;align-items:center;justify-content:center;
     min-height:100vh;padding:24px}
.box{background:#fff;border-radius:16px;padding:36px 24px 32px;max-width:420px;width:100%;
     text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.ico{width:64px;height:64px;margin:0 auto 20px;border-radius:50%;background:#fff4e5;
     display:flex;align-items:center;justify-content:center;font-size:32px;line-height:1}
h1{font-size:19px;font-weight:600;margin-bottom:14px;color:#1f2329}
.main{font-size:15px;line-height:1.7;color:#4e5969}
.main b{color:#1677ff;font-weight:600}
.sub{margin-top:16px;padding-top:16px;border-top:1px solid #f0f1f3;font-size:13px;
     line-height:1.6;color:#86909c}
</style>
</head>
<body>
  <div class="box">
    <div class="ico">&#9888;&#65039;</div>
    <h1>此二维码已停用</h1>
    <p class="main">请扫描 <b>柜机屏幕上显示的二维码</b> 取包</p>
    <p class="sub">如柜机屏幕未显示二维码，请联系现场工作人员协助</p>
  </div>
</body>
</html>
